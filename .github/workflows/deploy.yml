name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npm run typecheck

      - name: Проверить генераторы заданий
        run: npm run content:check

      - name: Проверить арифметический движок
        run: npm run test:engine

      - name: Проверить интерфейс и сценарии урока
        run: npm run test:smoke

      - name: Проверить локальное хранилище
        run: npm run audit:storage

      - name: Собрать приложение для GitHub Pages
        run: npm run build
        env:
          VITE_BASE: /stolbik/
          VITE_COMMIT_SHA: ${{ github.sha }}

      - name: Проверить стартовую PWA-оболочку
        run: npm run test:boot

      - name: Загрузить сборку Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v4
